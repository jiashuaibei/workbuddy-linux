name: Sync official Linux releases
on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/track-releases.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-tracker
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'jiashuaibei/workbuddy-linux'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test scripts
        run: bash scripts/test.sh
      - name: Check official endpoints once and save snapshots
        id: check
        continue-on-error: true
        run: python3 scripts/track_official.py
      - name: Save check status separately
        if: always() && steps.check.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: check-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/check/
          retention-days: 7
          if-no-files-found: error
      - name: Commit only changed release records
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/releases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Linux versions'
            git push
          fi
      # Retry incomplete publication even when version records did not change.
      # Publish one complete pair; never mark a partial release as Latest.
      - name: Download and publish DEB and RPM together
        id: release
        if: steps.check.outputs.deb == 'true' && steps.check.outputs.rpm == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_official.py --metadata-dir dist/check/upstream
      - name: Compare website with last successful deployment
        id: site
        run: python3 scripts/plan_site.py
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.deploy == 'true'
        with:
          path: web
      - uses: actions/deploy-pages@v4
        if: steps.site.outputs.deploy == 'true'
        id: deployment
      - name: Report failures after independent work finishes
        if: always()
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
        run: |
          printf '\nCombined DEB/RPM release=%s. Pages=%s.\n' "$RELEASE_RESULT" "$DEPLOY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CHECK_RESULT" == failure || "$RELEASE_RESULT" == failure ]]; then
            exit 1
          fi
