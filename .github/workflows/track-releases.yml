name: Track official Linux releases
on:
  schedule:
    - cron: '1 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-tracker
  cancel-in-progress: false
jobs:
  track:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check official endpoints
        id: check
        continue-on-error: true
        run: python3 scripts/track_official.py
      - name: Save observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/releases.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official Linux observations'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Report upstream failure after publishing status
        if: steps.check.outcome == 'failure'
        run: exit 1
